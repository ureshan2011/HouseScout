name: CI

# Fast checks on every push and pull request. The deploy workflow is slow (it
# scrapes, harvests photos and trains the model), so correctness is verified here
# instead of being discovered during a deploy.

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

      - name: Smoke-test the build pipeline
        run: |
          # Verifies the pipeline scripts run end to end and agree with each other.
          # Photo harvesting is skipped: it needs network access to a third party.
          python scripts/build_listings.py
          python scripts/hedonic.py
          python scripts/provenance.py
          python scripts/generate_ai_insights.py
          python - <<'EOF'
          import json, pathlib
          pub = pathlib.Path("frontend/public")
          listings = json.loads((pub / "listings.json").read_text())
          model = json.loads((pub / "model.json").read_text())
          insights = json.loads((pub / "insights.json").read_text())
          # Listings can legitimately be zero: the scraper talks to a third party that
          # may block CI, and there is deliberately no fabricated fallback. What must
          # hold is that the pipeline produced coherent output for whatever it got.
          assert model["coefficients"], "model has no coefficients"
          assert len(insights) == len(listings), "analysis missing for some listings"
          for l in listings:
              assert "data_quality" in l, "provenance annotation missing"
              assert l.get("price_estimate"), f"no price estimate for {l.get('address')}"
              # Without the district tag the frontend's region filter has nothing to
              # filter on, and the failure is invisible — the listings look fine.
              assert l.get("region"), f"no district on {l.get('address')}"
          if not listings:
              print("WARNING: scrape returned nothing (source may be blocking CI)")
          districts = sorted({l["region"] for l in listings})
          print(f"OK: {len(listings)} listings from {districts}, model n_train={model['n_train']}")
          EOF

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test the finance and strategy engines
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
